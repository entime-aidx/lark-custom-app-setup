name: Validate setup guides and preflight
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/preflight.test.mjs
      - run: node tests/validate-content.mjs
      - name: Windows setup tests (mock installers, Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/setup-windows.test.ps1
      - name: Windows setup tests (mock installers, PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/setup-windows.test.ps1
      - name: Download and verify pinned setup (no installation)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/start-windows.ps1 -PrepareOnly
